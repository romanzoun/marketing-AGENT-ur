[project]
name = "linkedin-agents"
version = "0.1.0"
description = "Deterministische LinkedIn-Werkzeuge für das Codex-CLI-Marketing-Team (Playwright)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
