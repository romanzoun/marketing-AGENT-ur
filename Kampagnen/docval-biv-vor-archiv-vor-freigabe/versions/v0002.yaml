name: DocVal + BIV — vor Archiv / vor Freigabe
version: 2
objective: 'Awareness → Expertise & Vertrauen → Profil-/Website-Besuch → Gespräch
  / Demo

  für Swisscom Document Validator (+ Business Identity Validator).


  Der Content soll nicht primär verkaufen, sondern bei der relevanten Zielgruppe

  Problembewusstsein schaffen, Fachkompetenz aufbauen und Swisscom bzw. Roman

  als glaubwürdigen Ansprechpartner für die Prüfung digital signierter Dokumente

  positionieren.


  Enger ICP:

  Teams, die eingehende signierte PDFs vor Archivierung oder Freigabe prüfen müssen

  und sensible Dateien nicht in Fremd-Clouds hochladen dürfen.


  Kernbotschaft:

  Signierte PDFs nicht einfach aufgrund eines grünen Hakens akzeptieren, sondern

  nachvollziehbar und belastbar prüfen.


  Document Validator:

  PDF bleibt in der eigenen Umgebung, nur der Hash wird für die Validierung verwendet.

  Belastbarere Zertifikatsauswertung statt ausschliesslich eines visuellen Status.


  Business Identity Validator:

  Ergänzend prüfen, welche Person bzw. welches Unternehmen hinter einer Signatur steht

  und welche Informationen zur Berechtigung verfügbar sind.


  Primäres Content-Ziel:

  Aufmerksamkeit, Relevanz, Vertrauen und fachliche Positionierung.


  Sekundäres Content-Ziel:

  Website-Besuche, Direktnachrichten, Gespräche und Demo-Anfragen.


  Nicht jeder Post braucht einen Produktlink oder einen Verkaufs-CTA.


  Link im Post nur dann einsetzen, wenn er inhaltlich sinnvoll ist.

  Immer UTM verwenden.

  Approval vor Publish.

  '
language: de
audience: 'Records-/Posteingang-Sachbearbeitung, Vertragsadministration, Compliance
  Operations,

  Records Management, ECM/DMS-Verantwortliche, Legal Operations und Digitalisierungs-

  verantwortliche in Banking, Versicherungen, öffentlicher Verwaltung und Grossunternehmen

  mit Audit-, Compliance- oder Datenschutzanforderungen.


  Besonders relevant für Teams mit regelmässigem Eingang digital signierter PDFs,

  ungefähr ab 10 Prüfungen pro Monat oder bei besonders sensitiven Dokumenten.


  Fokus nicht auf "alle Backoffice-Mitarbeitenden", sondern auf konkrete Prozesse,

  Rollen und Situationen rund um signierte Dokumente.

  '
personas:
- 'User:

  Sachbearbeitung Records/Posteingang, Vertragsadministration, Compliance Operations.


  Typische Fragen:

  - Ist diese Signatur wirklich gültig?

  - Kann ich dieses Dokument archivieren oder freigeben?

  - Muss ich noch etwas zusätzlich prüfen?

  - Wie dokumentiere ich die Prüfung?

  - Darf ich dieses sensible Dokument für die Prüfung extern hochladen?

  '
- 'Buyer / Champion:

  Teamlead Records/ECM, Compliance Lead, Legal Operations, Digitalization Lead,

  Enterprise Content Management, Prozessverantwortliche.


  Typische Fragen:

  - Wie standardisieren wir den Prüfprozess?

  - Wie reduzieren wir manuelle Unsicherheit?

  - Wie integrieren wir die Prüfung in bestehende Prozesse?

  - Wie dokumentieren wir die Prüfung nachvollziehbar?

  - Wie können wir Volumen effizient bearbeiten?

  '
- 'Blocker / Mitentscheider:

  IT, Security, Datenschutz, Procurement und Legal.


  Typische Fragen:

  - Wohin gelangen die Dokumente?

  - Welche Daten verlassen unsere Umgebung?

  - Wie funktioniert der Datenfluss?

  - Ist die Lösung integrierbar?

  - Welche Aussagen dürfen wir rechtlich aus der Prüfung ableiten?

  - Wie sieht die technische und organisatorische Absicherung aus?

  '
products:
- 'Swisscom Document Validator


  Prüft ZertES-/eIDAS-signierte PDFs.

  Das PDF bleibt in der eigenen Umgebung; für die Validierung wird der Hash verwendet.


  Positionierung:

  Nicht nur "grüner Haken", sondern nachvollziehbare Zertifikats- und Signaturprüfung.


  Typische Anwendung:

  Prüfung eingehender digital signierter PDFs vor Archivierung, Freigabe

  oder Weiterverarbeitung.

  '
- 'Swisscom Business Identity Validator (BIV)


  Ergänzt die technische Signaturprüfung um Informationen zur Identität hinter

  der Signatur.


  Storyline:

  1. Ist die Signatur valide?

  2. Wer hat unterschrieben?

  3. Für welches Unternehmen?

  4. Welche Informationen zur Berechtigung sind verfügbar?


  Nicht behaupten, dass BIV pauschal jede rechtliche Zeichnungsberechtigung

  abschliessend oder juristisch garantiert.

  '
voice: 'Authentisch und persönlich.


  Es spricht Roman als Mensch und Fachexperte, nicht die Marketingabteilung.


  Ton:

  - nahbar

  - intelligent

  - konkret

  - fachlich glaubwürdig

  - gelegentlich humorvoll

  - bildhaft

  - verständlich

  - nicht steif

  - nicht künstlich werblich


  Roman darf eine klare fachliche Perspektive einnehmen und Beobachtungen teilen.


  Gute Formulierungen fühlen sich an wie:

  "Das sehe ich in der Praxis immer wieder."

  "Genau an dieser Stelle wird es interessant."

  "Ein grüner Haken beantwortet eben nicht jede Frage."

  "Klingt banal. Ist es in der Praxis aber häufig nicht."


  Humor:

  Gezielt einsetzen, wenn er das Thema verständlicher oder menschlicher macht.

  Kein erzwungener Humor.


  Fachbegriffe:

  Verwenden, wenn sie zur Zielgruppe gehören.

  Komplexe Begriffe möglichst anhand konkreter Situationen erklären.


  Grundhaltung:

  Wir helfen Kunden dabei, sichere und praktikable Prozesse aufzubauen.

  Kein Angstmarketing.

  Keine Heilsversprechen.

  Kein Buzzword-Bingo.


  Nicht jeder Post muss verkaufen.

  Ein guter Post darf auch einfach eine interessante Beobachtung, Erfahrung,

  Frage oder fachliche Einordnung liefern.


  Auch in Kommentaren und Replies dieselbe Stimme verwenden:

  freundlich, fachlich, intelligent und persönlich.

  '
