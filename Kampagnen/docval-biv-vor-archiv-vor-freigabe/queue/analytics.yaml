  text: 'Ein Türsteher kann einen Ausweis prüfen.


    Er entscheidet deshalb noch lange nicht, in welches Regal die Akte gehört. Sonst
    hätte die Bibliothek am Eingang ein kleines Organisationsproblem.


    Bei eingehenden signierten PDFs sehe ich diese Trennung genauso. Vor der Archivierung
    brauchen Records-/ECM-Teams belastbare Prüfinformationen. Danach folgt die Records-Entscheidung.


    Der Swisscom Document Validator prüft bei ZertES-/eIDAS-signierten PDFs Signatur-
    und Zertifikatsinformationen. Die PDF bleibt in der eigenen Umgebung, ihr Hash
    wird lokal gebildet.


    Ablageklasse, Aufbewahrungsfrist und Archivierungsentscheid legt er nicht fest.
    Das bleibt Aufgabe des Prozesses und der zuständigen Menschen.


    Trennt euer Records-/ECM-Prozess Prüfinformationen klar von Ablageklasse und Aufbewahrungsentscheidung?


    Vor dem Archivieren prüfen statt hoffen:

    https://trustservices.swisscom.com/de/products/validator/document-validator?utm_source=linkedin&utm_medium=social&utm_campaign=docval_biv_backoffice


    Für eine kurze Demo oder einen Austausch:

    DM oder Kommentar.


    #Compliance #eIDAS #RecordsManagement'
