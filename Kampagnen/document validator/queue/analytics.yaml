  text: 'Die Mantelnummer ist die digitale Signatur der Garderobe.


    Niemand interessiert sich dafür, was sonst noch auf dem Zettel steht. Entscheidend
    ist, ob Nummer 47 am Mantel zu Nummer 47 in meiner Hand passt.


    Bei elektronisch signierten PDFs ist es ähnlich: Entscheidend ist nicht der sichtbare
    Kringel im Dokument. Die relevanten Signaturinformationen stecken im Zertifikat.


    Das sichtbare Signaturbild hat für die technische Prüfung keine Bedeutung. Es
    kann aber Vertrauen vorspielen – und damit zum Angriffsvektor werden. Sieht offiziell
    aus. Ist nur leider kein Prüfergebnis.


    Darum setzen wir auf unseren diskreten Swisscom Document Validator. Er prüft bei
    ZertES-/eIDAS-signierten PDFs Signatur- und Zertifikatsinformationen. Die PDF
    bleibt in der eigenen Umgebung, ihr Hash wird lokal gebildet.


    Prüft ihr noch den Kringel – oder schon das Zertifikat?


