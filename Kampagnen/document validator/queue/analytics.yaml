  kind: post
  text: 'Ein signiertes PDF kommt per Mail rein – und dann?


    Oft wird der Anhang erstmal heruntergeladen, irgendwo hochgeladen, geprüft und
    danach wieder zurück in den eigentlichen Prozess gebracht.


    Eigentlich unnötig kompliziert.


    Wir haben deshalb den Swisscom Document Validator direkt in Outlook integriert.
    Signierte PDF-Anhänge können damit direkt dort geprüft werden, wo sie ankommen.


    Der Validator prüft unter anderem die ZertES-/eIDAS-Signatur und die Zertifikatsinformationen.
    Das PDF selbst bleibt dabei in der eigenen Umgebung, der Hash wird lokal gebildet.


    Für mich ist das ein bisschen wie eine Eingangskontrolle direkt an der Tür: prüfen,
    bevor das Dokument archiviert oder weiterverarbeitet wird – ohne zusätzliche Umwege.


    Wichtig ist aber auch: Eine technisch gültige Signatur bedeutet noch nicht automatisch,
    dass jemand für ein Unternehmen unterschreiben durfte.


    Das sind zwei unterschiedliche Fragen:


    Ist die Signatur gültig?


    Und war die Person auch zeichnungsberechtigt?


    Genau für den zweiten Teil kann unser Business Identity Validator zusätzlichen
    Kontext zu Person, Unternehmen und Berechtigung liefern.


    Mich würde interessieren: Wie läuft das bei euch heute? Wie viele Stationen durchläuft
    ein signierter Anhang, bevor er geprüft und archiviert wird?


