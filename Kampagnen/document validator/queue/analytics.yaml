- item_id: post-2026-09-10-0002
  campaign: DocVal + BIV — vor Archiv / vor Freigabe
  campaign_version: 1
  kind: post
  text: 'Eine Signatur ohne geschäftlichen Kontext ist für mich wie ein Namensschild
    vor dem Sitzungszimmer: Ich kenne den Namen. Ob die Person fürs Unternehmen zeichnen
    darf, steht nicht drauf.


    Für mich ist die Rollenverteilung einfach: Der Swisscom Document Validator prüft
    die signierte PDF und die Zertifikatsinformationen. Der Business Identity Validator
    ergänzt den geschäftlichen Kontext zu Zeichner, Unternehmen und Berechtigung.


    Das ist keine Rechtsgarantie. Teams in Vertragsadministration und Compliance Ops
    erhalten aber eine nachvollziehbarere Grundlage: Wer hat für welches Unternehmen
    signiert – und welche Berechtigung steht dahinter?


    Die PDF bleibt dabei in der eigenen Umgebung; ihr Hash wird lokal gebildet.


    Meine juristische Kristallkugel bleibt also im Schrank. Dort staubt sie ohnehin
    nur ein.


    Vor dem Archivieren prüfen statt hoffen:

    https://trustservices.swisscom.com/de/products/validator/document-validator?utm_source=linkedin&utm_medium=social&utm_campaign=docval_biv_backoffice

    — für eine kurze Demo/Beratung: DM oder Kommentar.


    #Compliance #eIDAS #RecordsManagement'
