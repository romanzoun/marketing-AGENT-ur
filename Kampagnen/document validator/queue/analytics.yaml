- item_id: post-2026-09-12-0001
  campaign: DocVal + BIV — vor Archiv / vor Freigabe
  campaign_version: 1
  kind: post
  text: 'Einen LKW würde ich am Werkstor nicht jedes Mal komplett ausladen, wenn ich
    nicht den nicht kenne. Manuelle Überprüfung ist mühsam.


    Bei regelmässig eingehenden signierten PDFs sehe ich das ähnlich. Wenn Records-,
    Posteingang- oder Vertragsadmin-Teams jede Prüfung als spontane Einzelaktion behandeln,
    wird aus einem Kontrollpunkt schnell eine kleine Tagesreise.


    Mir ist lieber, die Prüfung steht fest im Records-/ECM-Workflow: vor Freigabe
    oder Archivierung, wiederholbar und nachvollziehbar. Per API kann der Swisscom
    Document Validator als solcher Prüfschritt eingebunden werden. Er prüft ZertES-/eIDAS-Signatur
    und Zertifikatsinformationen belastbarer. Die PDF bleibt in der eigenen Umgebung;
    ihr Hash wird lokal gebildet.


    Der Mensch bleibt am Steuer – der LKW muss nur nicht für jeden Kontrollblick zerlegt
    werden.


    Wo steht euer fester Prüfschalter im Records-/ECM-Prozess?


    Vor dem Archivieren prüfen statt hoffen:

    https://trustservices.swisscom.com/de/products/validator/document-validator?utm_source=linkedin&utm_medium=social&utm_campaign=docval_biv_backoffice

    — für eine kurze Demo/Beratung: DM oder Kommentar.


    #Compliance #eIDAS #RecordsManagement'
