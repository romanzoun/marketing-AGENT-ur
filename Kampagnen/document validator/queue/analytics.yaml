  kind: post
  text: 'Ein Audit ist wie ein sehr höflicher Detektiv.


    Es sagt nicht: «Das sah damals schon vernünftig aus.»

    Es fragt: «Wie genau seid ihr zu dieser Entscheidung gekommen?»


    Und plötzlich ist «Wir haben die PDF angeschaut» ungefähr so hilfreich wie ein
    Alibi auf einer Serviette.


    Vor Freigabe oder Archivierung zählt deshalb nicht nur die Prüfung. Auch ihr Ergebnis
    sollte nachvollziehbar festgehalten werden: Signatur, Zertifikatsinformationen
    und die Grundlage der Entscheidung.


    Der Swisscom Document Validator liefert dafür eine belastbarere Auswertung. Der
    Business Identity Validator kann zusätzlich Kontext zu Zeichner, Unternehmen und
    Berechtigung geben.


    Könnte euer Team eine Freigabeentscheidung Monate später noch sauber erklären?


