- item_id: comment-2026-09-12-0008
  campaign: DocVal + BIV — vor Archiv / vor Freigabe
  campaign_version: 1
  kind: comment
  text: 'I care less about whether an agent can explain itself elegantly than whether
    I can reproduce the path from evidence to decision. A deterministic audit trail
