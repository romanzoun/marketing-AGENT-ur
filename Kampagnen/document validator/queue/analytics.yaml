  text: 'Der Absendername im Posteingang ist wie die Klingelbeschriftung.


    Nett zu wissen, wer läutet. Noch kein Prüfbericht für das Paket.


    In Records/Posteingang, Vertragsadministration und Compliance Ops kommen signierte
    PDFs über bekannte Domains, vertraute E-Mail-Adressen oder gewohnte Portale an.
    Das sagt etwas über den Eingangskanal. Nicht aber, welche Signatur- und Zertifikatsinformationen
    in der PDF vorliegen.


    Darum würde ich zwei Fragen nicht in denselben Briefkasten werfen:


    Wie kam das Dokument an?

    Was lässt sich an der signierten PDF prüfen?


    Der Swisscom Document Validator prüft bei entsprechend ZertES-/eIDAS-signierten
    PDFs Signatur- und Zertifikatsinformationen. Die PDF bleibt in der eigenen Umgebung,
    ihr Hash wird lokal gebildet. Er authentisiert weder den E-Mail-Absender noch
    das Portal.


    Ein vertrauter Bote und ein geprüftes Paket sind zwei verschiedene Dinge.


    Trennt euer Eingang heute klar zwischen «kam über einen vertrauten Kanal» und
    «die signierte PDF wurde geprüft»?


