  text: 'Digitalisierung sollte Prozesse effizienter machen. Eigentlich selbstverständlich.


    Bei der digitalen Signatur endet die Effizienz aber oft genau dort, wo das Dokument
    im Backoffice ankommt.


    Die Signatur wurde eingeführt. Records/Posteingang, Vertragsadministration und
    Compliance Ops prüfen eingehende signierte PDFs trotzdem manuell. Denn wie die
    Gegenpartei signiert, lässt sich nicht standardisieren. Wie wir diese Dokumente
    vor Annahme, Freigabe oder Archivierung prüfen, dagegen schon.


    Genau dort wollen wir aus verifizierbaren Daten einen echten Effizienzgewinn machen.


    Der Swisscom Document Validator liefert bei ZertES-/eIDAS-signierten PDFs Signatur-
    und Zertifikatsinformationen für einen festen Kontrollpunkt im eigenen Prozess.
    Die PDF bleibt in der eigenen Umgebung, ihr Hash wird lokal gebildet.


    So wird die digitale Signatur nicht nur vorne digital, sondern schafft auch im
    Backoffice einen Mehrwert.


    Wie effizient ist eure digitale Signatur, nachdem das Dokument eingegangen ist?


