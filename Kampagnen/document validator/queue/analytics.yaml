    bleibt?


    Der Swisscom Document Validator prüft die Signatur und wertet Zertifikatsinformationen
    belastbarer aus. Die PDF bleibt in der eigenen Umgebung; lokal wird ihr Hash gebildet.
    Also Kein Aufwand, nur grünes Licht direkt im Prozess anwendbar für sensitive
    oder grosse Dokumente, weil das Dokument ihren Browser nicht verlässt.


    Welche Details müssen bei euch sichtbar bleiben, damit aus dem grünen Licht kein
