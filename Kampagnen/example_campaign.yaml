name: "DevTools Growth Q3"
objective: "Positionierung als Thought Leader für Developer-Produktivität und Aufbau von Reichweite in der DACH-Tech-Community."
language: "de"
audience: "Softwareentwickler:innen, Engineering Leads und CTOs in der DACH-Region"

# Optional: konkretere Personas der Zielgruppe
personas:
  - "Engineering Lead (30-45), will Team-Velocity steigern, wenig Zeit für Tooling"
  - "CTO im Scale-up, sucht messbare DevEx-Verbesserungen ohne Risiko"

# Produkte/Angebote inkl. kurzem Nutzen — worüber kommuniziert wird
products:
  - "FlowCI — CI/CD-Plattform: halbiert Build-Zeiten, weniger flaky Tests"
  - "DevPulse — DevEx-Analytics: macht Produktivitäts-Engpässe sichtbar"

voice: "Fachlich fundiert, nahbar, meinungsstark aber respektvoll. Kein Buzzword-Bingo, keine Emojis-Flut."

topics:
  - "Developer Experience"
  - "CI/CD und Automatisierung"
  - "AI-gestützte Softwareentwicklung"
  - "Open Source"
  - "Team-Produktivität"

banned_topics:
  - "Politik"
  - "Religion"
  - "Konkurrenten namentlich schlechtreden"
  - "unbelegte Heilsversprechen"

keywords_to_engage:
  - "developer experience"
  - "ci/cd"
  - "copilot"
  - "automatisierung"
  - "open source"

required_hashtags:
  - "#DeveloperExperience"
  - "#DevProductivity"

cta: "Neugierig? Schreib mir eine DM oder kommentiere deine Erfahrung."

max_post_chars: 1300
max_comment_chars: 500

limits:
  posts_per_run: 1
  comments_per_run: 3
  replies_per_run: 2
  reshares_per_run: 1

images:
  enabled: true
  style: "clean, modern, professional tech illustration, LinkedIn-tauglich"
  ratio: 0.5

schedule:
  start: null            # z.B. 2026-09-09; null = sofort
  end: null              # z.B. 2026-09-30; null = offen (mit --loop)
  cycle_interval_minutes: 120
  active_hours: [8, 20]  # nur zwischen 08:00 und 20:00 aktiv
  max_cycles: null       # z.B. 10; null = unbegrenzt bis Enddatum
